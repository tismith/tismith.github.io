name: Jekyll CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      JEKYLL_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Temporary compatibility baseline for github-pages 175 / Jekyll 3.6.
      # Upgrade Ruby together with the legacy dependencies.
      - name: Set up Ruby and install locked dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.6'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Verify generated homepage
        run: test -s _site/index.html
