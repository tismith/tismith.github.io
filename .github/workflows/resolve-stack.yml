name: Resolve upgraded Ruby dependencies
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'deps/upgrade-ruby-jekyll'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler: '2.4.22'
      - run: bundle lock --update --add-platform ruby x86_64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: upgraded-gem-lockfile
          path: Gemfile.lock
